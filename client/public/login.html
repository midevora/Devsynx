<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSynx - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .highlight {
            color: #3498db;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .password-input-group {
            position: relative;
        }

        .password-input-group input {
            padding-right: 68px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 2px 4px;
            background: none;
            border: none;
            color: #3498db;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .password-toggle svg {
            display: block;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .password-toggle .eye-off {
            display: none;
        }

        .password-toggle.is-visible .eye {
            display: none;
        }

        .password-toggle.is-visible .eye-off {
            display: block;
        }

        .password-toggle:hover {
            color: #2980b9;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #2980b9;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background-color: #fadbd8;
            color: #c0392b;
            border: 1px solid #f5b7b1;
        }

        .alert-success {
            background-color: #d5f4e6;
            color: #27ae60;
            border: 1px solid #a9dfbf;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>DevSynx <span class="highlight">Login</span></h1>
            <p>Welcome to the Management Console</p>
        </div>

        <div id="errorMsg" class="alert alert-error" style="display: none;"></div>
        <div id="successMsg" class="alert alert-success" style="display: none;"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group password-input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password">
                    <svg class="eye" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 3 18 18"></path>
                        <path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.5 17.5 0 0 1-3.1 3.8"></path>
                        <path d="M6.7 6.7C3.7 8.5 2 12 2 12s3.5 6 10 6a10.7 10.7 0 0 0 4.1-.8"></path>
                    </svg>
                </button>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', () => {
            const isPasswordHidden = passwordInput.type === 'password';
            passwordInput.type = isPasswordHidden ? 'text' : 'password';
            const label = `${isPasswordHidden ? 'Hide' : 'Show'} password`;
            passwordToggle.classList.toggle('is-visible', isPasswordHidden);
            passwordToggle.setAttribute('aria-label', label);
            passwordToggle.setAttribute('title', label);
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Hide previous messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = '✅ Login successful! Redirecting...';
                    successMsg.style.display = 'block';

                    // Restore any persisted profile picture for this account
                    const savedProfile = localStorage.getItem(`developerProfile_${data.user.email}`);
                    if (savedProfile) {
                        try {
                            const profileData = JSON.parse(savedProfile);
                            data.user = {
                                ...data.user,
                                profilePic: profileData.profilePic || data.user.profilePic || null,
                                name: profileData.name || data.user.name
                            };
                        } catch (err) {
                            console.warn('Could not restore saved profile picture on login:', err);
                        }
                    }

                    // Save user to localStorage
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect based on role
                    setTimeout(() => {
                        const role = data.user.role;
                        if (role === 'manager') {
                            window.location.href = 'manager.html';
                        } else if (role === 'developer') {
                            window.location.href = 'developer.html';
                        } else if (role === 'team_head') {
                            window.location.href = 'teamhead.html';
                        } else if (role === 'client') {
                            window.location.href = 'client.html';
                        }
                    }, 1500);
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Login failed');
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (err) {
                errorMsg.textContent = '❌ Cannot connect to server. Make sure the backend is running.';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                if (userData.role === 'manager') {
                    window.location.href = 'manager.html';
                }
            }
        });
    </script>
</body>
</html>
