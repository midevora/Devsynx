<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSynx - Manager Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #2c3e50;
        }

        .dashboard-wrapper {
            height: 100vh;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .navbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .navbar-center h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }

        .navbar-center p {
            font-size: 11px;
            opacity: 0.85;
            margin: 3px 0 0 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-self: start;
            grid-column: 1;
            padding-left: 52px;
        }

        .menu-btn {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.14);
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-50%) translateY(-1px);
        }

        .navbar-brand h1 {
            font-size: 28px;
            margin: 0;
        }

        .navbar-brand p {
            font-size: 12px;
            opacity: 0.9;
            margin: 0;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-self: end;
            grid-column: 3;
        }

        .user-role {
            background-color: rgba(255, 200, 87, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .logout-btn {
            background-color: rgba(255, 87, 34, 0.8);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: rgba(255, 87, 34, 1);
            transform: translateY(-2px);
        }

        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            width: 100%;
            min-height: 0;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .analytics-card {
            background: white;
            border: 1px solid #edf0f7;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.06);
        }

        .analytics-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .analytics-card-header h2 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .analytics-card-header p {
            color: #8993a4;
            font-size: 13px;
        }

        .analytics-total {
            color: #667eea;
            font-size: 24px;
            font-weight: 800;
        }

        .progress-chart-list {
            display: flex;
            flex-direction: column;
            gap: 17px;
            height: 320px;
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: #667eea #edf0f7;
        }

        .progress-chart-list::-webkit-scrollbar {
            width: 7px;
        }

        .progress-chart-list::-webkit-scrollbar-track {
            background: #edf0f7;
            border-radius: 999px;
        }

        .progress-chart-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 999px;
        }

        .chart-row {
            min-width: 0;
        }

        .chart-row-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 7px;
            color: #485568;
            font-size: 13px;
            font-weight: 600;
        }

        .chart-row-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chart-row-value {
            color: #667eea;
            font-weight: 800;
        }

        .chart-track {
            height: 9px;
            overflow: hidden;
            border-radius: 999px;
            background: #edf0f7;
        }

        .chart-fill {
            height: 100%;
            min-width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #667eea, #9b75e8);
            transition: width 0.5s ease;
        }

        .chart-fill-team {
            background: linear-gradient(90deg, #2ec4b6, #49d89c);
        }

        .company-total {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 24px;
        }

        .company-total-item {
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(145deg, #f7f8ff, #f1f8f7);
        }

        .company-total-item span {
            display: block;
            color: #8993a4;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .company-total-item strong {
            color: #2c3e50;
            font-size: 26px;
        }

        .analytics-empty {
            color: #8993a4;
            font-size: 13px;
            padding: 20px 0;
        }

        .performance-card {
            margin-bottom: 24px;
        }

        .performance-chart {
            position: relative;
            height: 230px;
            padding: 10px 0 28px 34px;
        }

        .performance-y-axis {
            position: absolute;
            top: 10px;
            bottom: 30px;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #a0a8b8;
            font-size: 11px;
        }

        .performance-plot {
            position: relative;
            height: 100%;
            border-bottom: 1px solid #e8ebf3;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent calc(25% - 1px),
                #eef0f6 calc(25% - 1px),
                #eef0f6 25%
            );
        }

        .performance-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .performance-area {
            fill: url(#performanceGradient);
            opacity: 0.3;
        }

        .performance-line {
            fill: none;
            stroke: #667eea;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .performance-point {
            fill: white;
            stroke: #667eea;
            stroke-width: 3;
        }

        .performance-labels {
            position: absolute;
            left: 34px;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            color: #8993a4;
            font-size: 11px;
        }

        .performance-summary {
            color: #667eea;
            font-size: 13px;
            font-weight: 700;
        }

        .page-header h1 {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header p {
            font-size: 16px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .view-heading h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .view-heading p {
            color: #7f8c8d;
        }

        .view-count {
            color: #667eea;
            background: #eef0ff;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }

        /* Dashboard Home Styles */
        .dashboard-home {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 30px;
            border-radius: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-card-purple {
            background: linear-gradient(135deg, #667eea 0%, #7c5cba 100%);
        }

        .stat-card-pink {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-card-cyan {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-card-green {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 48px;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .action-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .action-btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Teams Section */
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .teams-container {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
            height: 600px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            margin-bottom: 40px;
        }

        .teams-search {
            width: 100%;
            padding: 11px 13px;
            margin: 0 0 16px;
            border: 1px solid #dfe4ef;
            border-radius: 9px;
            background: #f8f9fc;
            color: #2c3e50;
            font: inherit;
            font-size: 13px;
        }

        .teams-search:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .teams-search::placeholder {
            color: #8993a4;
        }

        .teams-container::-webkit-scrollbar {
            width: 10px;
        }

        .teams-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .teams-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
            cursor: pointer;
        }

        .teams-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .projects-container {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
            height: 600px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            margin-bottom: 40px;
        }

        .projects-container::-webkit-scrollbar {
            width: 10px;
        }

        .projects-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .projects-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
            cursor: pointer;
        }

        .projects-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .team-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            border: 1px solid #edf0f7;
        }

        .team-card:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transform: translateY(-3px);
        }

        .team-dropdown-menu {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            min-width: 180px;
            border: 1px solid #e0e0e0;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #2c3e50;
        }

        .dropdown-item:first-child {
            border-radius: 8px 8px 0 0;
        }

        .dropdown-item:last-child {
            border-radius: 0 0 8px 8px;
        }

        .dropdown-item:hover:not(:disabled) {
            background: #f5f5f5;
        }

        .dropdown-item-danger {
            color: #c0392b;
        }

        .dropdown-item-danger:hover:not(:disabled) {
            background: #fadbd8;
        }

        .dropdown-item:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dropdown-item-edit {
            color: #667eea;
        }

        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .edit-modal {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .edit-modal h2 {
            margin: 0 0 20px 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .edit-modal .form-group {
            margin-bottom: 20px;
        }

        .edit-modal label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .edit-modal input,
        .edit-modal select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .edit-modal input:focus,
        .edit-modal select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .edit-modal .members-list {
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        .edit-modal .member-checkbox {
            display: flex;
            align-items: center;
            padding: 8px;
            font-size: 14px;
            color: #2c3e50;
        }

        .edit-modal .member-checkbox input {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        .edit-modal .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .edit-modal .btn-save,
        .edit-modal .btn-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .edit-modal .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .edit-modal .btn-save:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .edit-modal .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .edit-modal .btn-cancel {
            background: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
        }

        .edit-modal .btn-cancel:hover {
            background: #bdc3c7;
            color: white;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .team-name {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .member-badge {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-section {
            margin-bottom: 12px;
        }

        .progress-label {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .task-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .task-stat {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .task-stat-number {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .task-stat-label {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-stat-done .task-stat-number { color: #27ae60; }
        .task-stat-active .task-stat-number { color: #f39c12; }
        .task-stat-pending .task-stat-number { color: #e74c3c; }

        /* Projects Table Styles */
        .projects-section {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        .projects-search {
            width: 100%;
            padding: 11px 13px;
            margin: 0 0 16px;
            border: 1px solid #dfe4ef;
            border-radius: 9px;
            background: #f8f9fc;
            color: #2c3e50;
            font: inherit;
            font-size: 13px;
        }

        .projects-search:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .projects-search::placeholder {
            color: #8993a4;
        }

        .projects-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            background: white;
            border-radius: 14px;
            overflow: hidden;
        }

        .projects-table thead {
            background: #f5f6fb;
            border-bottom: 2px solid #ecf0f1;
        }

        .projects-table th {
            padding: 16px 18px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .projects-table td {
            padding: 18px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
            color: #5b6673;
        }

        .projects-table tbody tr:hover {
            background-color: #fafaff;
        }

        .project-name-cell {
            color: #2c3e50;
            font-size: 15px;
        }

        .project-description {
            display: block;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #16834b;

        .dark-mode .teams-container::-webkit-scrollbar-thumb {
            background: #667eea;
        }

        .dark-mode .teams-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .dark-mode .projects-container {
            border-color: #404050;
            background: #2a2a3e;
        }

        .dark-mode .projects-container::-webkit-scrollbar-track {

        }

        .dark-mode .projects-container::-webkit-scrollbar-thumb {

        }

        .dark-mode .projects-container::-webkit-scrollbar-thumb:hover {

        }

                align-items: flex-start;
                flex-direction: column;

            .projects-container {
                height: auto;
                padding: 12px;
            }

            .projects-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .analytics-grid {
                grid-template-columns: 1fr;
            }

            .project-create-layout {
                grid-template-columns: 1fr;
            }

            .project-list-panel {
                position: static;
                order: 2;

            .team-list-panel {

                order: 2;

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ManagerDashboard() {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [navigationDrawerOpen, setNavigationDrawerOpen] = useState(false);
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [developers, setDevelopers] = useState([]);
            const [teamHeads, setTeamHeads] = useState([]);
            const [teams, setTeams] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [teamMembers, setTeamMembers] = useState({});
            const [lastUpdateTime, setLastUpdateTime] = useState(new Date());
            const [darkMode, setDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
            const [profileData, setProfileData] = useState({
                name: '',
                profilePicture: null
            });
            const [profileSettingsOpen, setProfileSettingsOpen] = useState(false);
            const [stats, setStats] = useState({
                totalTeams: 0,
                teamMembers: 0,
                activeTasks: 0,
                completedTasks: 0
            });

            useEffect(() => {
                // Check if user is logged in
                const storedUser = localStorage.getItem('user');
                if (!storedUser) {
                    window.location.href = 'login.html';
                    return;
                }
                const userData = JSON.parse(storedUser);
                if (userData.role !== 'manager') {
                    window.location.href = 'login.html';
                    return;
                }
                setUser(userData);
                
                // Load profile data from separate persistent storage
                const savedProfile = localStorage.getItem('managerProfile');
                if (savedProfile) {
                    const profileData = JSON.parse(savedProfile);
                    setProfileData({
                        name: profileData.name || userData.name || 'Manager',
                        profilePicture: profileData.profilePicture || null
                    });
                } else {
                    setProfileData({
                        name: userData.name || 'Manager',
                        profilePicture: userData.profilePicture || null
                    });
                }

                // Load projects and developers
                fetchProjects();
                fetchDevelopers();
                fetchTeamHeads();
                fetchTeams();
                fetchTasks();
                fetchTeamMembers();
            }, []);

            useEffect(() => {
                // Calculate stats whenever teams, developers, tasks, or teamMembers change
                calculateStats();
            }, [teams, developers, tasks, teamMembers]);

            useEffect(() => {
                // Refresh tasks every 10 seconds for real-time progress updates
                // Initial fetch happens immediately
                fetchTasks();
                const interval = setInterval(() => {
                    fetchTasks();
                }, 10000);
                return () => clearInterval(interval);
            }, []);

            const calculateStats = () => {
                let teamMembersCount = 0;
                let completedCount = 0;
                let activeCount = 0;

                // Count all team members from teamMembers state
                Object.keys(teamMembers).forEach(teamId => {
                    if (teamMembers[teamId] && Array.isArray(teamMembers[teamId])) {
                        teamMembersCount += teamMembers[teamId].length;
                    }
                });

                // Count tasks by status
                tasks.forEach(task => {
                    if (task.status === 'completed' || task.status === 'done') {
                        completedCount++;
                    } else if (task.status === 'active' || task.status === 'in-progress' || task.status === 'ongoing') {
                        activeCount++;
                    }
                });
                
                console.log('📊 Stats updated:', { totalTeams: teams.length, teamMembers: teamMembersCount, activeTasks: activeCount, completedTasks: completedCount });
                
                setStats({
                    totalTeams: teams.length,
                    teamMembers: teamMembersCount,
                    activeTasks: activeCount,
                    completedTasks: completedCount
                });
            };

            const fetchProjects = async () => {
                try {
                    const response = await fetch('/api/projects');
                    const data = await response.json();
                    console.log('Projects response:', data);
                    let projectsArray = [];
                    if (Array.isArray(data)) {
                        projectsArray = data;
                    } else if (data.projects && Array.isArray(data.projects)) {
                        projectsArray = data.projects;
                    } else if (data.data && Array.isArray(data.data)) {
                        projectsArray = data.data;
                    }
                    setProjects(projectsArray);
                } catch (err) {
                    console.error('Error fetching projects:', err);
                    setProjects([]);
                }
            };

            const fetchDevelopers = async () => {
                try {
                    const response = await fetch('/api/developers');
                    const data = await response.json();
                    console.log('Developers response:', data);
                    let developersArray = [];
                    if (Array.isArray(data)) {
                        developersArray = data;
                    } else if (data.developers && Array.isArray(data.developers)) {
                        developersArray = data.developers;
                    } else if (data.data && Array.isArray(data.data)) {
                        developersArray = data.data;
                    }
                    setDevelopers(developersArray);
                } catch (err) {
                    console.error('Error fetching developers:', err);
                    setDevelopers([]);
                }
            };

            const fetchTeamHeads = async () => {
                try {
                    const response = await fetch('/api/team-heads');
                    const data = await response.json();
                    console.log('Team Heads response:', data);
                    let teamHeadsArray = [];
                    if (Array.isArray(data)) {
                        teamHeadsArray = data;
                    } else if (data.teamHeads && Array.isArray(data.teamHeads)) {
                        teamHeadsArray = data.teamHeads;
                    } else if (data.data && Array.isArray(data.data)) {
                        teamHeadsArray = data.data;
                    }
                    setTeamHeads(teamHeadsArray);
                } catch (err) {
                    console.error('Error fetching team heads:', err);
                    setTeamHeads([]);
                }
            };

            const fetchTeams = async () => {
                try {
                    const response = await fetch('/api/teams');
                    const data = await response.json();
                    setTeams(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error fetching teams:', err);
                    setTeams([]);
                }
            };

            const fetchTasks = async () => {
                try {
                    const response = await fetch('/api/tasks');
                    const data = await response.json();
                    console.log('Tasks response:', data);
                    let tasksArray = [];
                    if (Array.isArray(data)) {
                        tasksArray = data;
                    } else if (data.tasks && Array.isArray(data.tasks)) {
                        tasksArray = data.tasks;
                    } else if (data.data && Array.isArray(data.data)) {
                        tasksArray = data.data;
                    }
                    setTasks(tasksArray);
                    setLastUpdateTime(new Date());
                } catch (err) {
                    console.error('Error fetching tasks:', err);
                    setTasks([]);
                    setLastUpdateTime(new Date());
                }
            };

            const fetchTeamMembers = async () => {
                try {
                    const response = await fetch('/api/team-members');
                    const data = await response.json();
                    console.log('Team members response:', data);
                    let membersDict = {};
                    
                    if (Array.isArray(data)) {
                        data.forEach(member => {
                            if (!membersDict[member.team_id]) {
                                membersDict[member.team_id] = [];
                            }
                            membersDict[member.team_id].push(member);
                        });
                    } else if (data.members && Array.isArray(data.members)) {
                        data.members.forEach(member => {
                            if (!membersDict[member.team_id]) {
                                membersDict[member.team_id] = [];
                            }
                            membersDict[member.team_id].push(member);
                        });
                    }
                    
                    setTeamMembers(membersDict);
                } catch (err) {
                    console.error('Error fetching team members:', err);
                    setTeamMembers({});
                }
            };

            const getTeamStats = (teamId) => {
                let doneCount = 0;
                let activeCount = 0;
                let pendingCount = 0;

                tasks.forEach(task => {
                    if (task.team_id === teamId) {
                        if (task.status === 'completed' || task.status === 'done') {
                            doneCount++;
                        } else if (task.status === 'active' || task.status === 'in-progress' || task.status === 'ongoing') {
                            activeCount++;
                        } else {
                            pendingCount++;
                        }
                    }
                });

                const totalTasks = doneCount + activeCount + pendingCount;
                const progress = totalTasks > 0 ? Math.round((doneCount / totalTasks) * 100) : 0;

                console.log(`Team ${teamId}: Done=${doneCount}, Active=${activeCount}, Pending=${pendingCount}, Total=${totalTasks}, Progress=${progress}%`);

                return {
                    done: doneCount,
                    active: activeCount,
                    pending: pendingCount,
                    progress: progress,
                    totalTasks: totalTasks
                };
            };

            const calculateTeamsProgress = () => {
                const progressData = {};
                teams.forEach(team => {
                    const stats = getTeamStats(team.id);
                    progressData[team.id] = {
                        teamName: team.team_name,
                        projectName: team.project_name || 'N/A',
                        teamHeadName: team.team_head_name || 'N/A',
                        completedTasks: stats.done,
                        activeTasks: stats.active,
                        pendingTasks: stats.pending,
                        totalTasks: stats.totalTasks,
                        progress: stats.progress,
                        completionRate: stats.totalTasks > 0 ? ((stats.done / stats.totalTasks) * 100).toFixed(1) : 0,
                        updatedAt: new Date().toISOString()
                    };
                });
                return progressData;
            };

            const handleLogout = () => {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            };

            const handleProfilePictureChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProfileData(prev => ({
                            ...prev,
                            profilePicture: reader.result
                        }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveProfile = () => {
                const updatedUser = {
                    ...user,
                    name: profileData.name,
                    profilePicture: profileData.profilePicture
                };
                // Save to both user and managerProfile for persistence
                localStorage.setItem('user', JSON.stringify(updatedUser));
                localStorage.setItem('managerProfile', JSON.stringify({
                    name: profileData.name,
                    profilePicture: profileData.profilePicture,
                    updatedAt: new Date().toISOString()
                }));
                setUser(updatedUser);
                alert('✅ Profile updated successfully!');
            };

            if (!user) {
                return <div style={{ textAlign: 'center', paddingTop: '50px' }}>Loading...</div>;
            }

            const handleThemeToggle = () => {
                const newDarkMode = !darkMode;
                setDarkMode(newDarkMode);
                localStorage.setItem('darkMode', newDarkMode);
            };

            return (
                <div className={`dashboard-wrapper ${darkMode ? 'dark-mode' : ''}`}>
                    <div className="navbar">
                        <button className="menu-btn" onClick={() => setNavigationDrawerOpen(true)} aria-label="Open dashboard navigation">
                            ☰
                        </button>
                        <div className="navbar-brand">
                            <div>
                                <h1>🎯 DevSynx</h1>
                                <p>Project Management System</p>
                            </div>
                        </div>
                        <div className="navbar-center">
                            <h1>✨ Manager Dashboard</h1>
                            <p>Manage teams & projects</p>
                        </div>
                    </div>

                    <div className="container">
                        {currentPage === 'dashboard' && (
                            <Dashboard 
                                view="dashboard"
                                stats={stats} 
                                developers={developers}
                                teams={teams}
                                projects={projects}
                                tasks={tasks}
                                teamMembers={teamMembers}
                                teamHeads={teamHeads}
                                getTeamStats={getTeamStats}
                                calculateTeamsProgress={calculateTeamsProgress}
                                lastUpdateTime={lastUpdateTime}
                                onRefresh={() => fetchTasks()}
                                onCreateTeam={() => setCurrentPage('team')}
                                onCreateProject={() => setCurrentPage('project')}
                                onGithubSettings={() => setCurrentPage('github')}
                                onTeamDeleted={() => {
                                    fetchTeams();
                                    fetchTeamMembers();
                                    fetchTasks();
                                }}
                                onProjectDeleted={() => {
                                    fetchProjects();
                                    fetchTeams();
                                    fetchTeamMembers();
                                    fetchTasks();
                                }}
                            />
                        )}

                        {currentPage === 'teams' && (
                            <Dashboard
                                view="teams"
                                stats={stats}
                                developers={developers}
                                teams={teams}
                                projects={projects}
                                tasks={tasks}
                                teamMembers={teamMembers}
                                teamHeads={teamHeads}
                                getTeamStats={getTeamStats}
                                calculateTeamsProgress={calculateTeamsProgress}
                                lastUpdateTime={lastUpdateTime}
                                onRefresh={() => fetchTasks()}
                                onCreateTeam={() => setCurrentPage('team')}
                                onCreateProject={() => setCurrentPage('project')}
                                onGithubSettings={() => setCurrentPage('github')}
                                onTeamDeleted={() => { fetchTeams(); fetchTeamMembers(); fetchTasks(); }}
                                onProjectDeleted={() => { fetchProjects(); fetchTeams(); fetchTeamMembers(); fetchTasks(); }}
                            />
                        )}

                        {currentPage === 'projects' && (
                            <Dashboard
                                view="projects"
                                stats={stats}
                                developers={developers}
                                teams={teams}
                                projects={projects}
                                tasks={tasks}
                                teamMembers={teamMembers}
                                teamHeads={teamHeads}
                                getTeamStats={getTeamStats}
                                calculateTeamsProgress={calculateTeamsProgress}
                                lastUpdateTime={lastUpdateTime}
                                onRefresh={() => fetchProjects()}
                                onCreateTeam={() => setCurrentPage('team')}
                                onCreateProject={() => setCurrentPage('project')}
                                onProjectDeleted={() => { fetchProjects(); fetchTeams(); fetchTeamMembers(); fetchTasks(); }}
                            />
                        )}

                        {currentPage === 'team' && (
                            <CreateTeam 
                                developers={developers} 
                                teamHeads={teamHeads} 
                                projects={projects}
                                onBack={() => setCurrentPage('dashboard')}
                                onTeamCreated={() => {
                                    fetchTeams();
                                    fetchTeamMembers();
                                    fetchTasks();
                                }}
                            />
                        )}

                        {currentPage === 'project' && (
                            <CreateProject 
                                onBack={() => setCurrentPage('dashboard')}
                                onProjectCreated={() => {
                                    fetchProjects();
                                    fetchTeams();
                                    fetchTeamMembers();
                                    fetchTasks();
                                }} 
                            />
                        )}

                        {currentPage === 'github' && (
                            <GithubSettings onBack={() => setCurrentPage('dashboard')} />
                        )}
                    </div>

                    {navigationDrawerOpen && (
                        <>
                            <div className="drawer-overlay" onClick={() => setNavigationDrawerOpen(false)}></div>
                            <div className="drawer navigation-drawer">
                                <div className="drawer-header">
                                    <div>
                                        <h2>Workspace</h2>
                                        <p style={{fontSize: '12px', opacity: 0.8, marginTop: '5px'}}>Manager navigation</p>
                                    </div>
                                    <button className="close-btn" onClick={() => setNavigationDrawerOpen(false)}>✕</button>
                                </div>
                                <div className="drawer-content">
                                    <div className="navigation-menu">
                                        <div className="navigation-label">Overview</div>
                                        <button className={`navigation-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => { setCurrentPage('dashboard'); setNavigationDrawerOpen(false); }}>
                                            <span>▦</span><span>Dashboard</span>
                                        </button>
                                        <div className="navigation-label" style={{marginTop: '16px'}}>Manage</div>
                                        <button className={`navigation-item ${currentPage === 'teams' ? 'active' : ''}`} onClick={() => { setCurrentPage('teams'); setNavigationDrawerOpen(false); }}>
                                            <span>👥</span><span>Teams</span>
                                        </button>
                                        <button className={`navigation-item ${currentPage === 'projects' ? 'active' : ''}`} onClick={() => { setCurrentPage('projects'); setNavigationDrawerOpen(false); }}>
                                            <span>▣</span><span>Projects</span>
                                        </button>
                                        <button className="navigation-item" onClick={() => { setCurrentPage('team'); setNavigationDrawerOpen(false); }}>
                                            <span>＋</span><span>Create team</span>
                                        </button>
                                        <button className="navigation-item" onClick={() => { setCurrentPage('project'); setNavigationDrawerOpen(false); }}>
                                            <span>＋</span><span>Create project</span>
                                        </button>
                                        <button className="navigation-item" onClick={() => { setCurrentPage('github'); setNavigationDrawerOpen(false); }}>
                                            <span>🐙</span><span>GitHub account</span>
                                        </button>
                                        <button
                                            className={`navigation-item ${profileSettingsOpen ? 'active' : ''}`}
                                            onClick={() => setProfileSettingsOpen(open => !open)}
                                            aria-expanded={profileSettingsOpen}
                                        >
                                            <span>⚙️</span><span>Profile Settings</span>
                                        </button>
                                    </div>

                                    {profileSettingsOpen && (
                                    <div className="navigation-profile">
                                        <div style={{textAlign: 'center'}}>
                                            <div 
                                                className="profile-picture" 
                                                onClick={() => document.getElementById('profilePictureInput').click()}
                                                title="Click to upload profile picture"
                                            >
                                                {profileData.profilePicture ? (
                                                    <img src={profileData.profilePicture} alt="Profile" />
                                                ) : (
                                                    '👤'
                                                )}
                                            </div>
                                            <input 
                                                id="profilePictureInput" 
                                                type="file" 
                                                className="file-input-hidden" 
                                                accept="image/*"
                                                onChange={handleProfilePictureChange}
                                            />
                                            <p style={{fontSize: '11px', color: '#7f8c8d', marginTop: '8px'}}>Click to change photo</p>
                                        </div>

                                        <div className="profile-info">
                                            <p style={{color: '#7f8c8d', fontSize: '12px'}}>Manager Account</p>
                                            <h3>{profileData.name}</h3>
                                        </div>

                                        <div className="profile-edit-section">
                                            <h4>Edit profile</h4>
                                            <input 
                                                type="text" 
                                                className="profile-input" 
                                                placeholder="Manager Name"
                                                value={profileData.name}
                                                onChange={(e) => setProfileData(prev => ({
                                                    ...prev,
                                                    name: e.target.value
                                                }))}
                                            />
                                            <button className="profile-btn-save" onClick={handleSaveProfile}>
                                                💾 Save Changes
                                            </button>
                                            <button 
                                                className="theme-toggle-btn" 
                                                onClick={handleThemeToggle}
                                                style={{marginTop: '10px', marginBottom: '10px'}}
                                            >
                                                {darkMode ? '☀️ Light Mode' : '🌙 Dark Mode'}
                                            </button>
                                            <button 
                                                className="profile-btn-save" 
                                                onClick={handleLogout}
                                                style={{background: '#e74c3c', marginTop: '10px'}}
                                            >
                                                🚪 Sign Out
                                            </button>
                                        </div>
                                    </div>
                                    )}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function Dashboard({ view = 'dashboard', stats, developers, teams, projects, tasks, teamMembers, teamHeads, getTeamStats, calculateTeamsProgress, lastUpdateTime, onRefresh, onCreateTeam, onCreateProject, onGithubSettings, onTeamDeleted, onProjectDeleted }) {
            const [openDropdown, setOpenDropdown] = useState(null);
            const [deletingTeamId, setDeletingTeamId] = useState(null);
            const [openProjectDropdown, setOpenProjectDropdown] = useState(null);
            const [deletingProjectId, setDeletingProjectId] = useState(null);
            const [editingTeamId, setEditingTeamId] = useState(null);
            const [editFormData, setEditFormData] = useState(null);
            const [editingTeamMembers, setEditingTeamMembers] = useState([]);
            const [updatingTeamId, setUpdatingTeamId] = useState(null);
            const [editingProjectId, setEditingProjectId] = useState(null);
            const [editProjectData, setEditProjectData] = useState(null);
            const [updatingProjectId, setUpdatingProjectId] = useState(null);
            const [projectSearch, setProjectSearch] = useState('');
            const [teamSearch, setTeamSearch] = useState('');

            const handleTeamCardClick = (teamId, e) => {
                e.stopPropagation();
                setOpenDropdown(openDropdown === teamId ? null : teamId);
            };

            const handleProjectRowClick = (projectId, e) => {
                e.stopPropagation();
                setOpenProjectDropdown(openProjectDropdown === projectId ? null : projectId);
            };

            const handleDeleteTeam = async (teamId, teamName) => {
                if (window.confirm(`Are you sure you want to delete team "${teamName}"?`)) {
                    setDeletingTeamId(teamId);
                    try {
                        const response = await fetch(`/api/teams/${teamId}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' }
                        });

                        const data = await response.json();

                        if (response.ok) {
                            alert('✅ Team deleted successfully!');
                            setOpenDropdown(null);
                            if (onTeamDeleted) {
                                onTeamDeleted();
                            }
                        } else {
                            alert('❌ ' + (data.error || 'Failed to delete team'));
                        }
                    } catch (err) {
                        alert('❌ Error deleting team: ' + err.message);
                    } finally {
                        setDeletingTeamId(null);
                    }
                }
            };

            const handleDeleteProject = async (projectId, projectName) => {
                if (window.confirm(`Are you sure you want to delete project "${projectName}"? This will also delete all associated teams.`)) {
                    setDeletingProjectId(projectId);
                    try {
                        const response = await fetch(`/api/projects/${projectId}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' }
                        });

                        const data = await response.json();

                        if (response.ok) {
                            alert('✅ Project deleted successfully!');
                            setOpenProjectDropdown(null);
                            if (onProjectDeleted) {
                                onProjectDeleted();
                            }
                        } else {
                            alert('❌ ' + (data.error || 'Failed to delete project'));
                        }
                    } catch (err) {
                        alert('❌ Error deleting project: ' + err.message);
                    } finally {
                        setDeletingProjectId(null);
                    }
                }
            };

            const handleEditProject = (project) => {
                setEditingProjectId(project.id);
                setEditProjectData({
                    name: project.name,
                    description: project.description || '',
                    startDate: project.start_date ? project.start_date.split('T')[0] : '',
                    expectedDeliveryDate: project.expected_delivery_date ? project.expected_delivery_date.split('T')[0] : ''
                });
                setOpenProjectDropdown(null);
            };

            const handleCancelProjectEdit = () => {
                setEditingProjectId(null);
                setEditProjectData(null);
                setUpdatingProjectId(null);
            };

            const handleUpdateProject = async () => {
                if (!editProjectData.name.trim()) {
                    alert('❌ Project name is required');
                    return;
                }

                if (!editProjectData.startDate) {
                    alert('❌ Start date is required');
                    return;
                }

                setUpdatingProjectId(editingProjectId);
                try {
                    const response = await fetch(`/api/projects/${editingProjectId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: editProjectData.name,
                            description: editProjectData.description,
                            start_date: editProjectData.startDate,
                            expected_delivery_date: editProjectData.expectedDeliveryDate
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('✅ Project updated successfully!');
                        handleCancelProjectEdit();
                        if (onProjectDeleted) {
                            onProjectDeleted();
                        }
                    } else {
                        alert('❌ ' + (data.error || 'Failed to update project'));
                    }
                } catch (err) {
                    alert('❌ Error updating project: ' + err.message);
                } finally {
                    setUpdatingProjectId(null);
                }
            };

            const filteredProjects = projects.filter(project => {
                const searchTerm = projectSearch.trim().toLowerCase();
                return !searchTerm || String(project.name || '').toLowerCase().includes(searchTerm);
            });

            const filteredTeams = teams.filter(team => {
                const searchTerm = teamSearch.trim().toLowerCase();
                return !searchTerm || String(team.team_name || '').toLowerCase().includes(searchTerm);
            });

            const handleEditTeam = (team) => {
                setEditingTeamId(team.id);
                setEditFormData({
                    team_name: team.team_name,
                    team_head_id: parseInt(team.team_head_id) // Ensure it's a number
                });
                // Extract just the developer IDs from member objects
                const memberIds = (teamMembers[team.id] || []).map(m => parseInt(m.developer_id || m.id));
                setEditingTeamMembers(memberIds);
                setOpenDropdown(null);
            };

            const handleCancelEdit = () => {
                setEditingTeamId(null);
                setEditFormData(null);
                setEditingTeamMembers([]);
            };

            const handleMemberToggle = (developerId) => {
                setEditingTeamMembers(prev => 
                    prev.includes(developerId)
                        ? prev.filter(id => id !== developerId)
                        : [...prev, developerId]
                );
            };

            const handleUpdateTeam = async () => {
                if (!editFormData.team_name.trim()) {
                    alert('❌ Team name is required');
                    return;
                }

                if (!editFormData.team_head_id) {
                    alert('❌ Team head is required');
                    return;
                }

                if (editingTeamMembers.length === 0) {
                    alert('❌ At least one team member is required');
                    return;
                }

                setUpdatingTeamId(editingTeamId);
                try {
                    console.log('📤 Sending update request for team:', editingTeamId);
                    const payload = {
                        team_name: editFormData.team_name,
                        team_head_id: parseInt(editFormData.team_head_id),
                        member_ids: editingTeamMembers.map(id => parseInt(id))
                    };
                    console.log('📦 Payload:', JSON.stringify(payload));
                    
                    const response = await fetch(`/api/teams/${editingTeamId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    console.log('📥 Response status:', response.status, response.statusText);
                    console.log('📥 Response headers:', response.headers);
                    
                    // Get text first to see what's being returned
                    const responseText = await response.text();
                    console.log('📥 Response text (first 500 chars):', responseText.substring(0, 500));
                    
                    // Try to parse as JSON
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (parseError) {
                        console.error('❌ Failed to parse response as JSON:', parseError);
                        alert('❌ Server responded with invalid data: ' + responseText.substring(0, 200));
                        return;
                    }

                    console.log('✅ Parsed response:', data);

                    if (response.ok) {
                        alert('✅ Team updated successfully!');
                        handleCancelEdit();
                        if (onTeamDeleted) {
                            onTeamDeleted();
                        }
                    } else {
                        alert('❌ ' + (data.error || 'Failed to update team'));
                    }
                } catch (err) {
                    console.error('❌ Error updating team:', err);
                    alert('❌ Error updating team: ' + err.message);
                } finally {
                    setUpdatingTeamId(null);
                }
            };

            const getProjectProgress = (project) => {
                const projectTeams = teams.filter(team => String(team.project_id) === String(project.id));
                const projectTeamIds = new Set(projectTeams.map(team => String(team.id)));
                const projectTasks = tasks.filter(task => projectTeamIds.has(String(task.team_id)));
                const completedTasks = projectTasks.filter(task => task.status === 'completed' || task.status === 'done').length;
                return projectTasks.length > 0 ? Math.round((completedTasks / projectTasks.length) * 100) : 0;
            };

            const projectProgress = projects.map(project => ({
                name: project.name,
                progress: getProjectProgress(project)
            }));

            const overallProjectProgress = projectProgress.length > 0
                ? Math.round(projectProgress.reduce((total, project) => total + project.progress, 0) / projectProgress.length)
                : 0;

            const teamProgress = teams.map(team => ({
                name: team.team_name,
                progress: getTeamStats(team.id).progress
            }));

            const performanceMonths = Array.from({length: 6}, (_, index) => {
                const date = new Date();
                date.setDate(1);
                date.setMonth(date.getMonth() - (5 - index));
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                const monthTasks = tasks.filter(task => {
                    const taskDate = new Date(task.updated_at || task.created_at || task.createdAt);
                    return !Number.isNaN(taskDate.getTime())
                        && `${taskDate.getFullYear()}-${String(taskDate.getMonth() + 1).padStart(2, '0')}` === monthKey;
                });
                const completed = monthTasks.filter(task => task.status === 'completed' || task.status === 'done').length;
                return {
                    label: date.toLocaleDateString(undefined, {month: 'short'}),
                    value: monthTasks.length > 0 ? Math.round((completed / monthTasks.length) * 100) : 0
                };
            });

            const performancePoints = performanceMonths.map((month, index) => {
                const x = performanceMonths.length === 1 ? 50 : (index / (performanceMonths.length - 1)) * 100;
                const y = 100 - month.value;
                return { ...month, x, y };
            });
            const performanceLine = performancePoints.map(point => `${point.x},${point.y}`).join(' ');
            const performanceArea = `0,100 ${performanceLine} 100,100`;
            const performanceChange = performanceMonths[performanceMonths.length - 1].value - performanceMonths[0].value;

            React.useEffect(() => {
                const handleClickOutside = () => {
                    setOpenDropdown(null);
                    setOpenProjectDropdown(null);
                };
                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, []);

            return (
                <div className="dashboard-home">
                    {view !== 'dashboard' && (
                        <div className="view-heading">
                            <div>
                                <h1>{view === 'teams' ? 'Teams' : 'Projects'}</h1>
                                <p>{view === 'teams' ? 'Organize people and track delivery progress.' : 'Keep every initiative visible, organized, and on schedule.'}</p>
                            </div>
                            <span className="view-count">{view === 'teams' ? `${teams.length} teams` : `${projects.length} projects`}</span>
                        </div>
                    )}

                    {/* Action Buttons */}
                    {view === 'dashboard' && <div className="action-buttons">
                        <button className="action-btn action-btn-primary" onClick={onCreateTeam}>
                            ➕ Create Team
                        </button>
                        <button className="action-btn action-btn-secondary" onClick={onCreateProject}>
                            📋 Create Project
                        </button>
                        <button className="action-btn action-btn-secondary" onClick={onGithubSettings}>
                            🐙 GitHub Account
                        </button>
                    </div>}

                    {view === 'dashboard' && <div className="analytics-grid">
                        <section className="analytics-card performance-card" style={{gridColumn: '1 / -1'}}>
                            <div className="analytics-card-header">
                                <div>
                                    <h2>Company performance</h2>
                                    <p>Monthly completion trend across all tracked tasks</p>
                                </div>
                                <span className="performance-summary">
                                    {performanceChange > 0 ? '↗' : performanceChange < 0 ? '↘' : '→'} {Math.abs(performanceChange)}% over 6 months
                                </span>
                            </div>
                            <div className="performance-chart">
                                <div className="performance-y-axis">
                                    <span>100%</span>
                                    <span>75%</span>
                                    <span>50%</span>
                                    <span>25%</span>
                                    <span>0%</span>
                                </div>
                                <div className="performance-plot">
                                    <svg className="performance-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Company performance over the last six months">
                                        <defs>
                                            <linearGradient id="performanceGradient" x1="0" x2="0" y1="0" y2="1">
                                                <stop offset="0%" stopColor="#667eea" />
                                                <stop offset="100%" stopColor="#667eea" stopOpacity="0" />
                                            </linearGradient>
                                        </defs>
                                        <polygon className="performance-area" points={performanceArea} />
                                        <polyline className="performance-line" points={performanceLine} />
                                        {performancePoints.map(point => (
                                            <circle className="performance-point" key={point.label} cx={point.x} cy={point.y} r="1.8" vectorEffect="non-scaling-stroke" />
                                        ))}
                                    </svg>
                                </div>
                                <div className="performance-labels">
                                    {performanceMonths.map(month => <span key={month.label}>{month.label}</span>)}
                                </div>
                            </div>
                        </section>

                        <section className="analytics-card">
                            <div className="analytics-card-header">
                                <div>
                                    <h2>Project progress</h2>
                                    <p>Completion across every active project</p>
                                </div>
                                <span className="analytics-total">{overallProjectProgress}%</span>
                            </div>
                            {projectProgress.length > 0 ? (
                                <div className="progress-chart-list">
                                    {projectProgress.map(project => (
                                        <div className="chart-row" key={project.name}>
                                            <div className="chart-row-header">
                                                <span className="chart-row-label">{project.name}</span>
                                                <span className="chart-row-value">{project.progress}%</span>
                                            </div>
                                            <div className="chart-track">
                                                <div className="chart-fill" style={{width: project.progress + '%'}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="analytics-empty">Create a project to start tracking progress.</p>
                            )}
                        </section>

                        <section className="analytics-card">
                            <div className="analytics-card-header">
                                <div>
                                    <h2>Team progress</h2>
                                    <p>Delivery health by team</p>
                                </div>
                                <span className="analytics-total">{teams.length}</span>
                            </div>
                            {teamProgress.length > 0 ? (
                                <div className="progress-chart-list">
                                    {teamProgress.map(team => (
                                        <div className="chart-row" key={team.name}>
                                            <div className="chart-row-header">
                                                <span className="chart-row-label">{team.name}</span>
                                                <span className="chart-row-value">{team.progress}%</span>
                                            </div>
                                            <div className="chart-track">
                                                <div className="chart-fill chart-fill-team" style={{width: team.progress + '%'}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="analytics-empty">Create a team to start tracking delivery.</p>
                            )}
                            <div className="company-total">
                                <div className="company-total-item">
                                    <span>Total teams</span>
                                    <strong>{teams.length}</strong>
                                </div>
                                <div className="company-total-item">
                                    <span>Total developers</span>
                                    <strong>{developers.length}</strong>
                                </div>
                            </div>
                        </section>
                    </div>}



                    {/* Teams Section */}
                    {view === 'teams' && teams.length > 0 && (
                        <div>
                            <h2 className="section-title">👥 Your Teams</h2>
                            <input
                                id="dashboardTeamSearch"
                                type="search"
                                className="teams-search"
                                value={teamSearch}
                                onChange={(event) => setTeamSearch(event.target.value)}
                                placeholder="🔍 Search teams by name..."
                                aria-label="Search teams by name"
                            />
                            <div className="teams-container">
                                <div className="teams-grid">
                                {filteredTeams.map(team => {
                                    const teamStats = getTeamStats(team.id);
                                    const memberCount = teamMembers[team.id] ? teamMembers[team.id].length : (team.members_count || 1);
                                    
                                    return (
                                    <div 
                                        key={team.id} 
                                        className="team-card"
                                        style={{position: 'relative'}}
                                        onClick={(e) => handleTeamCardClick(team.id, e)}
                                    >
                                        <div className="team-header">
                                            <div className="team-name">{team.team_name}</div>
                                            <div className="member-badge">{memberCount} members</div>
                                        </div>
                                        
                                        <div className="progress-section">
                                            <div className="progress-label">
                                                <span>Progress</span>
                                                <span>{teamStats.progress}%</span>
                                            </div>
                                            <div className="progress-bar">
                                                <div className="progress-fill" style={{width: teamStats.progress + '%'}}></div>
                                            </div>
                                        </div>

                                        <div className="task-stats">
                                            <div className="task-stat task-stat-done">
                                                <div className="task-stat-number">✓ {teamStats.done}</div>
