                                                <div className="task-stat-label">Done</div>
                                            </div>
                                            <div className="task-stat task-stat-active">
                                                <div className="task-stat-number">⚡ {teamStats.active}</div>
                                                <div className="task-stat-label">Active</div>
                                            </div>
                                            <div className="task-stat task-stat-pending">
                                                <div className="task-stat-number">⏳ {teamStats.pending}</div>
                                                <div className="task-stat-label">Pending</div>
                                            </div>
                                        </div>

                                        {/* Dropdown Menu */}
                                        {openDropdown === team.id && (
                                            <div className="team-dropdown-menu" onClick={(e) => e.stopPropagation()}>
                                                <button 
                                                    className="dropdown-item dropdown-item-edit"
                                                    onClick={() => handleEditTeam(team)}
                                                >
                                                    Edit Team
                                                </button>
                                                <button 
                                                    className="dropdown-item dropdown-item-danger"
                                                    onClick={() => handleDeleteTeam(team.id, team.team_name)}
                                                    disabled={deletingTeamId === team.id}
                                                >
                                                    {deletingTeamId === team.id ? 'Deleting...' : 'Delete Team'}
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    );
                                })}
                            </div>
                            {filteredTeams.length === 0 && (
                                <div className="empty-state" style={{marginTop: '16px'}}>
                                    No teams match “{teamSearch}”.
                                </div>
                            )}
                            </div>
                        </div>
                    )}

                    {/* Projects Section */}
                    {view === 'projects' && projects.length > 0 && (
                        <div className="projects-container">
                            <div className="projects-section">
                                <h2 className="section-title">📋 Existing Projects</h2>
                                <input
                                    id="dashboardProjectSearch"
                                    type="search"
                                    className="projects-search"
                                    value={projectSearch}
                                    onChange={(event) => setProjectSearch(event.target.value)}
                                    placeholder="🔍 Search projects by name..."
                                    aria-label="Search projects by name"
                                />
                                <table className="projects-table">
                                <thead>
                                    <tr>
                                        <th>Project Name</th>
                                        <th>Description</th>
                                        <th>Start Date</th>
                                        <th>Delivery</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredProjects.map(project => (
                                        <tr key={project.id} style={{position: 'relative'}}>
                                            <td><strong className="project-name-cell">{project.name}</strong></td>
                                            <td><span className="project-description">{project.description || 'No description added'}</span></td>
                                            <td>{project.start_date ? new Date(project.start_date).toLocaleDateString() : 'N/A'}</td>
                                            <td>{project.expected_delivery_date ? new Date(project.expected_delivery_date).toLocaleDateString() : 'N/A'}</td>
                                            <td><span className="status-pill"><span>●</span> Active</span></td>
                                            <td>
                                                <button 
                                                    className="action-menu-btn"
                                                    onClick={(e) => handleProjectRowClick(project.id, e)}
                                                    style={{cursor: 'pointer'}}
                                                >
                                                    ⋮
                                                </button>
                                                {openProjectDropdown === project.id && (
                                                    <div className="project-dropdown-menu" onClick={(e) => e.stopPropagation()}>
                                                        <button 
                                                            className="dropdown-item dropdown-item-edit"
                                                            onClick={() => handleEditProject(project)}
                                                        >
                                                            Edit Project
                                                        </button>
                                                        <button 
                                                            className="dropdown-item dropdown-item-danger"
                                                            onClick={() => handleDeleteProject(project.id, project.name)}
                                                            disabled={deletingProjectId === project.id}
                                                        >
                                                            {deletingProjectId === project.id ? '⏳ Deleting...' : '🗑️ Delete Project'}
                                                        </button>
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {filteredProjects.length === 0 && (
                                <div className="empty-state" style={{marginTop: '16px'}}>
                                    No projects match “{projectSearch}”.
                                </div>
                            )}
                            </div>
                        </div>
                    )}
                    {view === 'teams' && teams.length === 0 && (
                        <div className="empty-state">
                            <div className="empty-state-icon">👥</div>
                            <h3>No teams yet</h3>
                            <p>Create your first team to start organizing delivery.</p>
                            <button className="action-btn action-btn-primary" onClick={onCreateTeam} style={{margin: '20px auto 0'}}>Create Team</button>
                        </div>
                    )}
                    {view === 'projects' && projects.length === 0 && (
                        <div className="empty-state">
                            <div className="empty-state-icon">📋</div>
                            <h3>No projects yet</h3>
                            <p>Create a project to give your teams a clear direction.</p>
                            <button className="action-btn action-btn-secondary" onClick={onCreateProject} style={{margin: '20px auto 0'}}>Create Project</button>
                        </div>
                    )}
                {/* Edit Team Modal */}
                {editingTeamId && (
                    <div className="edit-modal-overlay" onClick={handleCancelEdit}>
                        <div className="edit-modal" onClick={(e) => e.stopPropagation()}>
                            <h2>Edit Team</h2>
                            <div className="form-group">
                                <label>Team Name</label>
                                <input type="text" value={editFormData?.team_name || ''} onChange={(e) => setEditFormData(prev => ({...prev, team_name: e.target.value}))} placeholder="Enter team name" />
                            </div>
                            <div className="form-group">
                                <label>Team Head</label>
                                <select value={editFormData?.team_head_id || ''} onChange={(e) => setEditFormData(prev => ({...prev, team_head_id: parseInt(e.target.value)}))}>
                                    <option value="">Select team head...</option>
                                    {teamHeads.map(head => (<option key={head.id} value={head.id}>{head.name}</option>))}
                                </select>
                            </div>
                            <div className="members-section">
                                <label>Team Members</label>
                                <div className="members-list">
                                    {developers.map(dev => (<label key={dev.id} className="member-checkbox"><input type="checkbox" checked={editingTeamMembers.includes(dev.id)} onChange={() => handleMemberToggle(dev.id)} />{dev.name}</label>))}
                                </div>
                            </div>
                            <div className="form-actions">
                                <button className="btn-save" onClick={handleUpdateTeam} disabled={updatingTeamId === editingTeamId}>{updatingTeamId === editingTeamId ? 'Saving...' : 'Save Changes'}</button>
                                <button className="btn-cancel" onClick={handleCancelEdit} disabled={updatingTeamId === editingTeamId}>Cancel</button>
                            </div>
                        </div>
                    </div>
                )}
                
                {/* Edit Project Modal */}
                {editingProjectId && (
                    <div className="edit-modal-overlay" onClick={handleCancelProjectEdit}>
                        <div className="edit-modal" onClick={(e) => e.stopPropagation()}>
                            <h2>Edit Project</h2>
                            <div className="form-group">
                                <label>Project Name</label>
                                <input 
                                    type="text" 
                                    value={editProjectData?.name || ''} 
                                    onChange={(e) => setEditProjectData(prev => ({...prev, name: e.target.value}))} 
                                    placeholder="Enter project name" 
                                />
                            </div>
                            <div className="form-group">
                                <label>Description</label>
                                <textarea 
                                    value={editProjectData?.description || ''} 
                                    onChange={(e) => setEditProjectData(prev => ({...prev, description: e.target.value}))} 
                                    placeholder="Enter project description (optional)"
                                    style={{minHeight: '100px'}}
                                />
                            </div>
                            <div className="form-group">
                                <label>Start Date</label>
                                <input 
                                    type="date" 
                                    value={editProjectData?.startDate || ''} 
                                    onChange={(e) => setEditProjectData(prev => ({...prev, startDate: e.target.value}))} 
                                />
                            </div>
                            <div className="form-group">
                                <label>Expected Delivery Date</label>
                                <input 
                                    type="date" 
                                    value={editProjectData?.expectedDeliveryDate || ''} 
                                    onChange={(e) => setEditProjectData(prev => ({...prev, expectedDeliveryDate: e.target.value}))} 
                                />
                            </div>
                            <div className="form-actions">
                                <button className="btn-save" onClick={handleUpdateProject} disabled={updatingProjectId === editingProjectId}>{updatingProjectId === editingProjectId ? 'Saving...' : 'Save Changes'}</button>
                                <button className="btn-cancel" onClick={handleCancelProjectEdit} disabled={updatingProjectId === editingProjectId}>Cancel</button>
                            </div>
                        </div>
                    </div>
                )}
                </div>
            );
        }

        function CreateTeam({ developers, teamHeads, projects, onBack, onTeamCreated }) {
            const [formData, setFormData] = useState({
                teamName: '',
                projectId: '',
                teamHeadId: '',
                members: []
            });
            const [message, setMessage] = useState('');
            const [error, setError] = useState('');
            const [teams, setTeams] = useState([]);
            const [loadingTeams, setLoadingTeams] = useState(false);

            useEffect(() => {
                fetchTeams();
            }, []);

            const fetchTeams = async () => {
                setLoadingTeams(true);
                try {
                    const response = await fetch('/api/teams');
                    const data = await response.json();
                    setTeams(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error fetching teams:', err);
                    setTeams([]);
                }
                setLoadingTeams(false);
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleMemberToggle = (developerId) => {
                setFormData(prev => ({
                    ...prev,
                    members: prev.members.includes(developerId)
                        ? prev.members.filter(id => id !== developerId)
                        : [...prev.members, developerId]
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.teamName || !formData.projectId || !formData.teamHeadId || formData.members.length === 0) {
                    setError('All fields and at least one team member are required');
                    return;
                }

                setError('');
                setMessage('');

                try {
                    const response = await fetch('/api/create-team', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setMessage('✅ Team created successfully!');
                        setFormData({ teamName: '', projectId: '', teamHeadId: '', members: [] });
                        setTimeout(() => {
                            fetchTeams();
                            onTeamCreated();
                        }, 1000);
                    } else {
                        setError('❌ ' + (data.error || 'Failed to create team'));
                    }
                } catch (err) {
                    setError('❌ Cannot connect to server');
                }
            };

            const handleDeleteTeam = async (teamId, teamName) => {
                if (window.confirm(`Are you sure you want to delete team "${teamName}"?`)) {
                    try {
                        const response = await fetch(`/api/teams/${teamId}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' }
                        });

                        const data = await response.json();

                        if (response.ok) {
                            setMessage('✅ Team deleted successfully!');
                            setTimeout(() => {
                                fetchTeams();
                                fetchTeamMembers();
                                fetchTasks();
                            }, 500);
                        } else {
                            setError('❌ ' + (data.error || 'Failed to delete team'));
                            console.error('Delete error:', data);
                        }
                    } catch (err) {
                        setError('❌ Cannot connect to server: ' + err.message);
                        console.error('Delete error:', err);
                    }
                }
            };

            return (
                <div>
                    <div style={{marginBottom: '20px'}}>
                        <button className="action-btn action-btn-primary" onClick={onBack} style={{background: '#667eea'}}>
                            ← Back to Dashboard
                        </button>
                    </div>
                    <div className="team-create-layout">
                        <aside className="team-list-panel">
                            <h3>👥 Existing Teams</h3>
                            <p className="project-list-subtitle">Browse and manage your teams</p>
                            {loadingTeams ? (
                                <p style={{ color: '#7f8c8d' }}>Loading teams...</p>
                            ) : teams.length === 0 ? (
                                <p style={{ color: '#7f8c8d' }}>No teams created yet</p>
                            ) : (
                                <div className="team-list-scroll">
                                    <div className="list-grid">
                                        {teams.map(team => (
                                            <div key={team.id} className="list-card">
                                                <div>
                                                    <h4>{team.team_name}</h4>
                                                    <p><strong>Project:</strong> {team.project_name || 'N/A'}</p>
                                                    <p><strong>Team Head:</strong> {team.team_head_name || 'N/A'}</p>
                                                </div>
                                                <button 
                                                    onClick={() => handleDeleteTeam(team.id, team.team_name)}
                                                    className="delete-btn"
                                                >
                                                    🗑️ Delete Team
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </aside>

                        <div className="form-container">
                        <h2 style={{ marginBottom: '25px', color: '#2c3e50' }}>Create a New Team</h2>

                        {message && <div className="alert alert-success">{message}</div>}
                        {error && <div className="alert alert-error">{error}</div>}

                        <form onSubmit={handleSubmit}>
                            <div className="form-row">
                                <div className="form-group">
                                    <label htmlFor="teamName">Team Name</label>
                                    <input
                                        type="text"
                                        id="teamName"
                                        name="teamName"
                                        value={formData.teamName}
                                        onChange={handleInputChange}
                                        placeholder="Enter team name"
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="projectId">Select Project</label>
                                    <select
                                        id="projectId"
                                        name="projectId"
                                        value={formData.projectId}
                                        onChange={handleInputChange}
                                    >
                                        <option value="">-- Choose a project --</option>
                                        {projects && projects.map(proj => (
                                            <option key={proj.id} value={proj.id}>
                                                {proj.name}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="form-group">
                                <label htmlFor="teamHeadId">Team Head</label>
                                <select
                                    id="teamHeadId"
                                    name="teamHeadId"
                                    value={formData.teamHeadId}
                                    onChange={handleInputChange}
                                >
                                    <option value="">-- Assign a team head --</option>
                                    {teamHeads && teamHeads.map(head => (
                                        <option key={head.id} value={head.id}>
                                            {head.name}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label>Select Team Members</label>
                                <div className="checkbox-group">
                                    {developers && developers.length > 0 ? (
                                        developers.map(dev => (
                                            <div key={dev.id} className="checkbox-item">
                                                <input
                                                    type="checkbox"
                                                    id={`dev-${dev.id}`}
                                                    checked={formData.members.includes(dev.id)}
                                                    onChange={() => handleMemberToggle(dev.id)}
                                                />
                                                <label htmlFor={`dev-${dev.id}`}>{dev.name} - {dev.role}</label>
                                            </div>
                                        ))
                                    ) : (
                                        <p style={{ color: '#7f8c8d' }}>No developers available</p>
                                    )}
                                </div>
                            </div>

                            <button type="submit" className="submit-btn">Create Team</button>
                        </form>

                        </div>
                    </div>
                </div>
            );
        }

        function GithubSettings({ onBack }) {
            const [formData, setFormData] = useState({
                github_org: '',
                github_repo: '',
                github_token: ''
            });
            const [hasToken, setHasToken] = useState(false);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                const manager = JSON.parse(localStorage.getItem('user') || '{}');
                fetch(`/api/github-settings?manager_email=${encodeURIComponent(manager.email || '')}`)
                    .then(async response => {
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || 'Unable to load GitHub settings');
                        setFormData({ github_org: data.github_org || '', github_repo: data.github_repo || '', github_token: '' });
                        setHasToken(Boolean(data.has_token));
                    })
                    .catch(err => setError(err.message))
                    .finally(() => setLoading(false));
            }, []);

            const handleInputChange = (event) => {
                const { name, value } = event.target;
                setFormData(previous => ({ ...previous, [name]: value }));
            };

            const handleSubmit = async (event) => {
                event.preventDefault();
                const manager = JSON.parse(localStorage.getItem('user') || '{}');
                setSaving(true);
                setMessage('');
                setError('');
                try {
                    const response = await fetch('/api/github-settings', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formData, manager_email: manager.email })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to save GitHub settings');
                    setHasToken(Boolean(data.has_token));
                    setFormData(previous => ({ ...previous, github_token: '' }));
                    setMessage('Company GitHub account saved. Task verification will use this repository.');
                } catch (err) {
                    setError(err.message);
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div>
                    <div style={{marginBottom: '20px'}}>
                        <button className="action-btn action-btn-primary" onClick={onBack} style={{background: '#667eea'}}>
                            ← Back to Dashboard
                        </button>
                    </div>
                    <div className="form-container">
                        <h2 style={{ marginBottom: '10px', color: '#2c3e50' }}>🐙 Company GitHub Account</h2>
                        <p style={{ marginBottom: '25px', color: '#7f8c8d' }}>
                            This repository is used to verify developer task uploads. The access token is stored only on the server.
                        </p>
                        {loading && <div className="alert">Loading GitHub settings...</div>}
                        {message && <div className="alert alert-success">✅ {message}</div>}
                        {error && <div className="alert alert-error">❌ {error}</div>}
                        {!loading && <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label htmlFor="settings_github_org">GitHub organization or account</label>
                                <input id="settings_github_org" name="github_org" value={formData.github_org} onChange={handleInputChange} placeholder="your-company" required />
                            </div>
                            <div className="form-group">
                                <label htmlFor="settings_github_repo">Repository</label>
                                <input id="settings_github_repo" name="github_repo" value={formData.github_repo} onChange={handleInputChange} placeholder="project-repository" required />
                            </div>
                            <div className="form-group">
                                <label htmlFor="settings_github_token">GitHub access token {hasToken ? '(leave blank to keep current token)' : ''}</label>
                                <input id="settings_github_token" name="github_token" type="password" value={formData.github_token} onChange={handleInputChange} placeholder={hasToken ? 'Token already saved' : 'github_pat_...'} autoComplete="new-password" />
                            </div>
                            <button type="submit" className="submit-btn" disabled={saving}>
                                {saving ? 'Saving...' : 'Save GitHub Account'}
                            </button>
                        </form>}
                    </div>
                </div>
            );
        }

        function CreateProject({ onBack, onProjectCreated }) {
            const [formData, setFormData] = useState({
                name: '',
                description: '',
                startDate: '',
                expectedDeliveryDate: '',
                client_email: '',
                github_org: '',
                github_repo: ''
            });
            const [message, setMessage] = useState('');
            const [error, setError] = useState('');
            const [projects, setProjects] = useState([]);
            const [clients, setClients] = useState([]);
            const [loadingProjects, setLoadingProjects] = useState(false);
            const [loadingClients, setLoadingClients] = useState(false);
            useEffect(() => {
                fetchProjects();
                fetchClients();
            }, []);

            const fetchProjects = async () => {
                setLoadingProjects(true);
                try {
                    const response = await fetch('/api/projects');
                    const data = await response.json();
                    setProjects(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error('Error fetching projects:', err);
                    setProjects([]);
                }
                setLoadingProjects(false);
            };

            const fetchClients = async () => {
                setLoadingClients(true);
                try {
                    const response = await fetch('/api/clients');
                    const data = await response.json();
                    setClients(Array.isArray(data.clients) ? data.clients : []);
                } catch (err) {
                    console.error('Error fetching clients:', err);
                    setClients([]);
                }
                setLoadingClients(false);
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.name || !formData.startDate) {
                    setError('Project name and start date are required');
                    return;
                }

                if (!formData.client_email) {
                    setError('Please select a registered client for this project');
                    return;
                }

                setError('');
                setMessage('');

                console.log('📤 Submitting form data:', formData);

                try {
                    const response = await fetch('/api/create-project', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();
                    console.log('📥 Response:', data);

                    if (response.ok) {
                        setMessage('✅ Project created successfully!');
                        setFormData({ name: '', description: '', startDate: '', expectedDeliveryDate: '', client_email: '', github_org: '', github_repo: '' });
                        setTimeout(() => {
                            fetchProjects();
                            onProjectCreated();
                        }, 1000);
                    } else {
                        setError('❌ ' + (data.error || 'Failed to create project'));
                    }
                } catch (err) {
                    setError('❌ Cannot connect to server');
                }
            };

            const handleDeleteProject = async (projectId, projectName) => {
                if (window.confirm(`Are you sure you want to delete project "${projectName}"? This will also delete all teams in this project.`)) {
                    try {
                        const response = await fetch(`/api/projects/${projectId}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' }
                        });

                        const data = await response.json();

                        if (response.ok) {
                            setMessage('✅ Project deleted successfully!');
                            setTimeout(() => {
                                fetchProjects();
                                onProjectCreated();
                            }, 500);
                        } else {
                            setError('❌ ' + (data.error || 'Failed to delete project'));
                            console.error('Delete error:', data);
                        }
                    } catch (err) {
                        setError('❌ Cannot connect to server: ' + err.message);
                        console.error('Delete error:', err);
                    }
                }
            };

            return (
                <div>
                    <div style={{marginBottom: '20px'}}>
                        <button className="action-btn action-btn-primary" onClick={onBack} style={{background: '#667eea'}}>
                            ← Back to Dashboard
                        </button>
                    </div>
                    <div className="project-create-layout">
                        <aside className="project-list-panel">
                            <h3>💼 Existing Projects</h3>
                            <p className="project-list-subtitle">Browse and manage your projects</p>
                            {loadingProjects ? (
                                <p style={{ color: '#7f8c8d' }}>Loading projects...</p>
                            ) : projects.length === 0 ? (
                                <p style={{ color: '#7f8c8d' }}>No projects created yet</p>
                            ) : (
                                <div className="project-list-scroll">
                                    <div className="list-grid">
                                        {projects.map(project => (
                                            <div key={project.id} className="list-card">
                                                <div>
                                                    <h4>{project.name}</h4>
                                                    {project.description && (
                                                        <p title={project.description}><strong>Description:</strong> {project.description}</p>
                                                    )}
                                                    {project.start_date && (
                                                        <p><strong>Start:</strong> {new Date(project.start_date).toLocaleDateString()}</p>
                                                    )}
                                                    {project.expected_delivery_date && (
                                                        <p><strong>Delivery:</strong> {new Date(project.expected_delivery_date).toLocaleDateString()}</p>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={() => handleDeleteProject(project.id, project.name)}
                                                    className="delete-btn"
                                                >
                                                    🗑️ Delete Project
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </aside>

                        <div className="form-container">
                        <h2 style={{ marginBottom: '25px', color: '#2c3e50' }}>Create a New Project</h2>

                        {message && <div className="alert alert-success">{message}</div>}
                        {error && <div className="alert alert-error">{error}</div>}

                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label htmlFor="name">Project Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    value={formData.name}
                                    onChange={handleInputChange}
                                    placeholder="Enter project name"
                                />
                            </div>
                            <div className="form-group">
                                <label htmlFor="description">Description</label>
                                <textarea
                                    id="description"
                                    name="description"
                                    value={formData.description}
                                    onChange={handleInputChange}
                                    placeholder="Enter project description (optional)"
                                ></textarea>
                            </div>
                            <div className="form-group">
                                <label htmlFor="startDate">Start Date</label>
                                <input
                                    type="date"
                                    id="startDate"
                                    name="startDate"
                                    value={formData.startDate}
                                    onChange={handleInputChange}
                                />
                            </div>
                            <div className="form-group">
                                <label htmlFor="expectedDeliveryDate">Expected Delivery Date</label>
                                <input
                                    type="date"
                                    id="expectedDeliveryDate"
                                    name="expectedDeliveryDate"
                                    value={formData.expectedDeliveryDate}
                                    onChange={handleInputChange}
                                />
                            </div>
                            <div className="form-group">
                                <label htmlFor="client_email">Assign Client</label>
                                <select
                                    id="client_email"
                                    name="client_email"
                                    value={formData.client_email}
                                    onChange={handleInputChange}
                                    required
                                >
                                    <option value="">Select a registered client...</option>
                                    {loadingClients ? (
                                        <option value="" disabled>Loading clients...</option>
                                    ) : clients.length > 0 ? (
                                        clients.map(client => (
                                            <option key={client.id} value={client.email}>{client.name} ({client.email})</option>
                                        ))
                                    ) : (
                                        <option value="" disabled>No registered clients found</option>
                                    )}
                                </select>
                            </div>
                            <div className="form-group">
                                <label htmlFor="github_org">Company GitHub Org</label>
                                <input
                                    type="text"
                                    id="github_org"
                                    name="github_org"
                                    value={formData.github_org}
                                    onChange={handleInputChange}
                                    placeholder="e.g. your-company"
                                />
                            </div>
                            <div className="form-group">
                                <label htmlFor="github_repo">GitHub Repo (optional)</label>
                                <input
                                    type="text"
                                    id="github_repo"
                                    name="github_repo"
                                    value={formData.github_repo}
                                    onChange={handleInputChange}
                                    placeholder="e.g. backend-api"
                                />
                            </div>
                            <button type="submit" className="submit-btn">Create Project</button>
                        </form>

                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<ManagerDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
