<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSynx - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .signup-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .highlight {
            color: #3498db;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        select {
            cursor: pointer;
            background-color: white;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #2980b9;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background-color: #fadbd8;
            color: #c0392b;
            border: 1px solid #f5b7b1;
        }

        .alert-success {
            background-color: #d5f4e6;
            color: #27ae60;
            border: 1px solid #a9dfbf;
        }

        .role-note {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>DevSynx <span class="highlight">Sign Up</span></h1>
            <p>Create your account to get started</p>
        </div>

        <div id="errorMsg" class="alert alert-error" style="display: none;"></div>
        <div id="successMsg" class="alert alert-success" style="display: none;"></div>

        <form id="signupForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">
            </div>

            <div class="input-group">
                <label for="role">User Role</label>
                <select id="role" required>
                    <option value="">-- Select Your Role --</option>
                    <option value="developer">Developer</option>
                    <option value="team_head">Team Head</option>
                    <option value="client">Client</option>
                </select>
                <div class="role-note">⚠️ Manager accounts are created by administrators only</div>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const signupBtn = document.getElementById('signupBtn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            // Validation
            if (!name || !email || !password || !role) {
                errorMsg.textContent = '❌ All fields are required';
                errorMsg.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = '❌ Password must be at least 6 characters';
                errorMsg.style.display = 'block';
                return;
            }

            // Hide previous messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating Account...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    // No email/OTP verification — create account and log in immediately
                    successMsg.textContent = '✅ Account created! Logging you in...';
                    successMsg.style.display = 'block';

                    localStorage.setItem('user', JSON.stringify(data.user));

                    setTimeout(() => {
                        const role = data.user.role;
                        if (role === 'manager') {
                            window.location.href = 'manager.html';
                        } else if (role === 'developer') {
                            window.location.href = 'developer.html';
                        } else if (role === 'team_head') {
                            window.location.href = 'teamhead.html';
                        } else if (role === 'client') {
                            window.location.href = 'client.html';
                        } else {
                            window.location.href = 'login.html';
                        }
                    }, 800);
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Signup failed');
                    errorMsg.style.display = 'block';
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Create Account';
                }
            } catch (err) {
                errorMsg.textContent = '❌ Cannot connect to server. Make sure the backend is running.';
                errorMsg.style.display = 'block';
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                if (userData.role === 'manager') {
                    window.location.href = 'manager.html';
                }
            }
        });
    </script>
</body>
</html>
